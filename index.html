<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретный проект</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }
        .header {
            margin-top: 50px;
            text-align: center;
            font-size: 24px;
            color: #00ff00;
            text-shadow: 0 0 15px #00ff00;
            z-index: 10;
        }
        .arrow {
            font-size: 40px;
            margin-top: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }
        .spacer {
            height: 6000px;
            width: 100%;
        }
        .meter-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        .footer-content {
            margin-bottom: 100px;
            text-align: center;
            max-width: 600px;
            padding: 30px;
            border: 2px dashed #ff0000;
            background-color: rgba(18, 2, 2, 0.95);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
            z-index: 10;
        }
        .warning-text {
            color: #ff3333;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .download-btn {
            display: inline-block;
            background-color: #ff0000;
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            background-color: #cc0000;
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div id="counter" class="meter-counter">Осталось: 5.0 м</div>

    <div class="header">
        <h1>КРИТИЧЕСКОЕ ОБНОВЛЕНИЕ СИСТЕМЫ</h1>
        <p>Листай в самый вниз для получения ссылки</p>
        <div class="arrow">↓</div>
    </div>

    <div class="spacer"></div>

    <div class="footer-content">
        <p class="warning-text">
            ВНИМАНИЕ: Это хак-файл (безобидная joke-программа). <br>
            После запуска появится текст поверх экрана. <br>
            Для закрытия и возврата рабочего стола нажмите клавишу F6!
        </p>
        <a href="https://github.com/LOSTERLQ/hackers/releases/download/prank222/main.exe" class="download-btn" download>СКАЧАТЬ ФАЙЛ</a>
    </div>

    <script>
        const counterEl = document.getElementById('counter');
        window.addEventListener('scroll', () => {
            const totalHeight = document.documentElement.scrollHeight;
            const viewHeight = window.innerHeight;
            const scrolled = window.scrollY;
            const remainingPx = totalHeight - viewHeight - scrolled;
            let remainingMeters = (remainingPx / 1000).toFixed(1);
            
            if (remainingMeters <= 0) {
                remainingMeters = 0;
                counterEl.style.opacity = '0';
            } else {
                counterEl.style.opacity = '1';
            }
            counterEl.innerText = `Осталось: ${remainingMeters} м`;
        });

        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const katakana = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890ABCDEF";
        const alphabet = katakana.split("");

        const fontSize = 16;
        let columns = canvas.width / fontSize;

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }

        setInterval(drawMatrix, 30);
    </script>

</body>
</html>
